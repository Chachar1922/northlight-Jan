name: CI and Deploy

# Runs automatically on every push to main (and on pull requests, without deploying).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. Cloud configuration must be valid before anything else happens.
  check-cloud:
    name: Check cloud configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-cloud.js

  # 2. Unit tests (tools) and Playwright tests (security, validation, integration).
  test:
    name: Unit and Playwright tests
    needs: check-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 3. Build the static site.
  build:
    name: Build site
    needs: [check-cloud, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 4. Deploy to GitHub Pages ONLY if every earlier job succeeded, and only from main.
  deploy:
    name: Deploy to GitHub Pages
    needs: [check-cloud, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
